[package]
name = "json-capi"
version = "0.1.0"
edition = "2021"

[lib]
name = "json_capi"
crate-type = ["cdylib"]

[features]
mem-trace = ["dep:stats_alloc"]

[dependencies]
serde_json = "1"
diplomat = { version = ">=0.14,<0.16" }
diplomat-runtime = { version = ">=0.14,<0.16" }
stats_alloc = { version = "0.1", optional = true }
